<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-4" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <style>
            input {
                display: none;
            }

            input:checked + label {
                background-color: oklch(37.9% 0.146 265.522);
            }

        </style>
        <title>Mokepon</title>
    </head>
    <body class="bg-sky-900">
        <h1 class="text-3xl font-bold text-center text-white p-8">Mokepon 🔥💧🌱</h1>
        
        <section id="select-mokepon" class="p-4 rounded-lg m-4 text-center">
            <h2 class="text-lg text-white text-center font-bold">Elige tu Mokepon</h2>
            
            <div class="cards inline-block">                
                <div id="cards-mokepon"></div>
                <p>
                    <button id="btn-mokepon" class="bg-indigo-500 hover:bg-indigo-700 text-white font-bold py-4 px-8 rounded">Selectionar</button>
                </p>
            </div>
        </section>
        
        <section id="select-attack" class="bg-white border border-gray-300 p-4 rounded-lg m-4 text-center">
            
            <h2 class="text-lg text-center font-bold">Elige tu ataque</h2>
            
            <div class="flex content-around justify-center mt-8">
                <p class="basis-1/3 content-center">Tu <span id="mokepon-name" class="font-bold"></span></p>
                <img style="width: 100px" src="./assets/versus.png" alt="">
                <p class="basis-1/3 content-center"><span id="enemy-name" class="font-bold"></span> enemigo </p>
            </div>

            <div>
                <p>Tienes: <span id="mokepon-attacks">5</span> ataques 👊</p>
            </div>
            
            <div id="attack-buttons" class="inline"></div>
            
            <div id="messages" class="inline-row bg-white border border-gray-300 p-4 rounded-lg m-4">

                <p class="text-center">Tus victorias: <span id="victorias-mokepon"></span></p>
                <p class="text-center">Victorias del enemigo:<span id="victorias-enemigo"></span></p>
               
                <!-- <p id="result"> Tu mascota atacó con <span id="player-attack"></span> y el enemigo con <span id="enemy-attack"></span>. Perdiste una vida. ☹️</p> -->
            </div>
        </section>
        
        <section id="restart" class="bg-white border border-gray-300 p-4 rounded-lg m-4">
            <button id="btn-restart" class="bg-gray-100 hover:bg-gray-200 text-black font-bold py-2 px-4 rounded">icon Reiniciar</button>
        </section> 

        <!-- <script src="./js/script.js"></script> -->
        <script src="./js/script@0.1.js"></script>
    </body>
</html>
